name: Publish listings

on:
  schedule:
    # GitHub cron is UTC. 06:00 London is 05:00 UTC in summer (BST) and
    # 06:00 UTC in winter (GMT), so trigger at both and let the gate step
    # below pick the one that matches today's offset.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Republish when hand-entered listings or a local run's results are pushed.
  push:
    branches: [main]
    paths:
      - "manual/**"
      - "local/listings.json"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages looks up the site URL
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Only run at 06:00 London time
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/London date +%z)
          if [ "$EVENT" != "schedule" ]; then run=true
          elif [ "$SCHEDULE" = "0 5 * * *" ] && [ "$offset" = "+0100" ]; then run=true
          elif [ "$SCHEDULE" = "0 6 * * *" ] && [ "$offset" = "+0000" ]; then run=true
          else run=false
          fi
          echo "London offset $offset, event $EVENT, schedule '$SCHEDULE' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install ".[dev]"

      - name: Offline tests
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -m "not network"

      # Keeps cached event detail pages (e.g. Union Chapel start times) between runs.
      - name: Restore HTTP cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Get Pages URL
        id: pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Collect listings
        if: steps.gate.outputs.run == 'true'
        env:
          # The currently published files are the "last good data" for venues that fail today.
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p site
          local_args=()
          [ -f local/listings.json ] && local_args=(--local local/listings.json)
          python -m listings collect \
            -o site/listings.json --previous "$BASE_URL/listings.json" \
            --status site/status.json --previous-status "$BASE_URL/status.json" \
            "${local_args[@]}"
          python scripts/20261024_make_index.py site
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: collect
    if: needs.collect.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}listings.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
